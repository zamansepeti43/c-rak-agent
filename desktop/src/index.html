<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Çırak</title>
  <style>
    :root{font-family:Segoe UI,Arial,sans-serif;color:#f5f7fb;background:#08090c}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;padding:0;background:#08090c}
    body{overflow:hidden;background:radial-gradient(circle at top right,#162033 0,#0b0d12 38%,#08090c 100%)}
    .shell{display:grid;grid-template-columns:230px 1fr;width:100vw;height:100vh;min-height:600px}
    aside{padding:24px 18px;border-right:1px solid rgba(255,255,255,.08);background:rgba(7,9,13,.92)}
    .brand{font-size:28px;font-weight:800}.muted{color:#8f98aa;font-size:13px}.status{margin-top:24px;padding:14px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:rgba(255,255,255,.04)}
    .dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#6b7280;margin-right:8px}.voiceState{display:block;margin-top:7px;color:#f4b942;font-size:12px}
    main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100vh}
    header{height:76px;flex:none;padding:18px 24px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;align-items:center}
    .hero{flex:none;padding:24px}.hero h1{margin:0 0 7px;font-size:28px}
    .chat{flex:1;min-height:0;overflow-y:auto;padding:0 24px 170px}
    .message{max-width:820px;margin:14px 0;padding:15px 17px;border-radius:16px;white-space:pre-wrap;line-height:1.55}
    .user{margin-left:auto;background:#1a2230;border:1px solid rgba(255,255,255,.08)}.assistant{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07)}
    .composer{position:fixed;left:230px;right:0;bottom:0;padding:16px 24px 22px;background:linear-gradient(to top,#08090c 48%,rgba(8,9,12,.94) 76%,transparent)}
    .row{display:flex;gap:10px;max-width:1000px;margin:0 auto;align-items:flex-end}
    textarea{flex:1;resize:none;min-height:58px;max-height:180px;padding:15px 16px;border-radius:16px;border:1px solid #4a5568;background:#11151c;color:#fff;outline:none;font:inherit;display:block}
    textarea:focus{border-color:#f4b942;box-shadow:0 0 0 2px rgba(244,185,66,.12)}
    button{border:0;border-radius:14px;min-height:58px;padding:0 20px;font-weight:700;cursor:pointer;background:#f4b942;color:#17120a}
    .secondary{background:#181d26;color:#f5f7fb;border:1px solid rgba(255,255,255,.1);min-height:42px}.mic{min-width:58px;font-size:20px}.mic.listening{background:#ef6b73;color:#fff}
    .controls{display:flex;gap:8px;align-items:center}.kbd{font-size:11px;color:#7f889a}
    @media(max-width:800px){.shell{grid-template-columns:1fr}aside{display:none}.composer{left:0}.chat{padding-left:16px;padding-right:16px}.hero{padding-left:16px;padding-right:16px}header{padding-left:16px;padding-right:16px}}
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand">🤖 Çırak</div>
      <div class="muted">Yerel masaüstü asistanı</div>
      <div class="status"><span class="dot" id="dot"></span><span id="status">Başlatılıyor...</span><span class="voiceState" id="voiceState">Ses: hazır</span></div>
      <div class="status"><strong>Yapabildikleri</strong><div class="muted" style="margin-top:8px;line-height:1.7">Kod • Dosya • Terminal<br>Video • Ses • Masaüstü</div></div>
    </aside>
    <main>
      <header>
        <div><strong>Çırak Desktop</strong><div class="muted">Konuş, görev ver, sonucu takip et.</div></div>
        <div class="controls"><span class="kbd">Ctrl+Enter gönder</span><button class="secondary" id="start">Agent'i Başlat</button></div>
      </header>
      <div class="hero"><h1>Bugün ne yapalım?</h1><div class="muted">Örneğin: “Çırak, kaybolan tavşan hakkında bir çocuk videosu üret.”</div></div>
      <section class="chat" id="chat"></section>
    </main>
  </div>
  <div class="composer">
    <div class="row">
      <textarea id="input" rows="1" placeholder="Çırağa bir görev ver..."></textarea>
      <button class="mic" id="mic" title="Konuş">🎙️</button>
      <button id="send">Gönder</button>
    </div>
  </div>
  <script>
    const chat=document.getElementById('chat');
    const input=document.getElementById('input');
    const send=document.getElementById('send');
    const start=document.getElementById('start');
    const mic=document.getElementById('mic');
    const status=document.getElementById('status');
    const dot=document.getElementById('dot');
    const voiceState=document.getElementById('voiceState');
    let listening=false;
    function add(role,text){const el=document.createElement('div');el.className=`message ${role}`;el.textContent=text;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;}
    function doSend(){const text=input.value.trim();if(!text)return;add('user',text);window.cirak.sendTask(text);input.value='';input.focus();}
    async function listen(){
      if(listening)return; listening=true; mic.classList.add('listening'); voiceState.textContent='Ses: dinliyor...';
      try{const result=await window.cirak.listen('auto');if(result.text){input.value=result.text;doSend();}else add('assistant','Çırak: Konuşmayı anlayamadım.');}
      catch(e){add('assistant','Çırak ses hatası: '+(e?.message||e));}
      finally{listening=false;mic.classList.remove('listening');}
    }
    send.onclick=doSend;start.onclick=()=>window.cirak.startAgent();mic.onclick=listen;
    input.addEventListener('keydown',e=>{if((e.key==='Enter'&&(e.ctrlKey||e.metaKey))){e.preventDefault();doSend()}});
    window.cirak.onOutput(t=>add('assistant',t.trim()));
    window.cirak.onStatus(s=>{status.textContent=s==='running'?'Agent çalışıyor':'Agent durdu';dot.style.background=s==='running'?'#3ddc97':'#6b7280';});
    window.cirak.onVoiceState(s=>{voiceState.textContent='Ses: '+({idle:'hazır',listening:'dinliyor',thinking:'düşünüyor',speaking:'konuşuyor'}[s]||s)});
    add('assistant','Merhaba. Ben Çırak. Mikrofon düğmesinden Türkçe konuşabilir veya görevi yazabilirsin.');
    input.focus();
  </script>
</body>
</html>

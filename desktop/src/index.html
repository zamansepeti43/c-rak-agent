<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Çırak</title>
  <style>
    html,body{width:100%;height:100%;margin:0;padding:0;background:#08090c;color:#fff;font-family:Segoe UI,Arial,sans-serif}
    body{overflow:hidden}
    .app{width:100%;height:100%;display:flex;flex-direction:column;background:#08090c}
    .top{height:64px;flex:0 0 64px;border-bottom:1px solid #252a33;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
    .brand{font-size:22px;font-weight:800}.sub{font-size:12px;color:#8f98aa;margin-top:2px}
    .top button,.send,.mic{border:1px solid #343b47;border-radius:12px;background:#181d26;color:#fff;cursor:pointer;padding:10px 16px;font-weight:700}
    .content{flex:1;min-height:0;display:flex;flex-direction:column}
    .welcome{padding:28px 30px 18px}.welcome h1{margin:0 0 8px;font-size:30px}.welcome p{margin:0;color:#8f98aa}
    #chat{flex:1;min-height:0;overflow:auto;padding:0 30px 130px}
    .message{max-width:850px;margin:12px 0;padding:14px 16px;border:1px solid #262c36;border-radius:16px;white-space:pre-wrap;line-height:1.5}
    .user{margin-left:auto;background:#182131}.assistant{background:#11151c}
    .composer{flex:0 0 auto;padding:14px 24px 20px;border-top:1px solid #222731;background:#0a0c10}
    .row{display:flex;gap:10px;max-width:1100px;margin:0 auto}
    textarea{flex:1;min-width:0;min-height:58px;max-height:180px;resize:none;border:1px solid #343b47;border-radius:16px;background:#11151c;color:#fff;padding:16px;outline:none;font:inherit;font-size:15px}
    textarea:focus{border-color:#f4b942}
    .mic{width:62px;padding:0;font-size:22px}.send{min-width:95px;background:#f4b942;color:#17120a;border-color:#f4b942}
    .state{font-size:12px;color:#8f98aa;margin-top:8px;text-align:center}
  </style>
</head>
<body>
<div class="app">
  <div class="top"><div><div class="brand">🤖 Çırak</div><div class="sub">Yerel masaüstü asistanı</div></div><button id="start">Agent'i Başlat</button></div>
  <div class="content">
    <div class="welcome"><h1>Bugün ne yapalım?</h1><p>Görevini aşağıdaki kutuya yaz veya 🎙️ ile konuş.</p></div>
    <div id="chat"></div>
  </div>
  <div class="composer">
    <div class="row"><textarea id="input" rows="1" placeholder="Çırağa bir görev ver..."></textarea><button class="mic" id="mic" title="Konuş">🎙️</button><button class="send" id="send">Gönder</button></div>
    <div class="state" id="state">Çırak hazırlanıyor...</div>
  </div>
</div>
<script>
const chat=document.getElementById('chat');const input=document.getElementById('input');const send=document.getElementById('send');const start=document.getElementById('start');const mic=document.getElementById('mic');const state=document.getElementById('state');let listening=false;
function add(role,text){if(!text)return;const el=document.createElement('div');el.className='message '+role;el.textContent=text;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;}
function doSend(){const text=input.value.trim();if(!text)return;add('user',text);window.cirak.sendTask(text);input.value='';input.focus();}
async function listen(){if(listening)return;listening=true;mic.textContent='⏺️';state.textContent='Dinliyorum...';try{const result=await window.cirak.listen('auto');if(result.text){input.value=result.text;doSend();}else add('assistant','Sesli komutu anlayamadım.');}catch(e){add('assistant','Ses hatası: '+(e&&e.message?e.message:e));}finally{listening=false;mic.textContent='🎙️';state.textContent='Hazır';}}
send.onclick=doSend;start.onclick=()=>window.cirak.startAgent();mic.onclick=listen;input.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();doSend()}});window.cirak.onOutput(t=>add('assistant',t.trim()));window.cirak.onStatus(s=>{state.textContent=s==='running'?'Agent çalışıyor':'Agent durdu'});window.cirak.onVoiceState(s=>{if(s==='listening')state.textContent='Dinliyorum...';else if(s==='speaking')state.textContent='Konuşuyor...';else if(s==='thinking')state.textContent='Düşünüyor...';});add('assistant','Merhaba. Ben Çırak. Görevini yazabilir veya mikrofonla konuşabilirsin.');input.focus();
</script>
</body>
</html>
